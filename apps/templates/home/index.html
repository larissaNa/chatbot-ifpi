{% extends "layouts/base.html" %}

{% block title %} Chatbot IFPI {% endblock title %}

{% block stylesheets %}{% endblock stylesheets %}

{% block content %}
<link type="text/css" href="{{ config.ASSETS_ROOT }}/css/index-chat.css" rel="stylesheet">

<div class="chat-container bg-white">
  <div class="chat-header">
    Piazinho
  </div>

  <div id="chat-box" class="chat-body">
    <!-- Conversa aparece aqui -->
  </div>

  <div class="chat-footer">
  <form id="chat-form" class="d-flex justify-content-center align-items-center gap-3" autocomplete="off">
    <input type="text" id="user-input" class="form-control flex-grow-1 rounded-pill px-4" placeholder="Digite sua mensagem" autocomplete="off" style="max-width: 80%;" aria-label="Mensagem">
    <button id="send-btn" type="submit" class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
      <svg id="send-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white" viewBox="0 0 24 24">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </form>
</div>


{% endblock content %}

{% block javascripts %}
<script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
 <script>
  const logoUrl = "{{ url_for('static', filename='assets/images/logo.png') }}";
</script>
 <script src="{{ config.ASSETS_ROOT }}/js/index-chat.js"></script>
{% endblock javascripts %}
