# version: '3.8'
services:
  appseed-app:
    container_name: appseed_app
    restart: always
    env_file: .env
    build: .
    command: flask run --host=0.0.0.0 --port=5005
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - db_network
      - web_network
    volumes:
      - ./apps:/apps
      - ./apps/static/assets/images:/apps/static/assets/images
      - ./migrations:/migrations
      - ./chroma_db:/chroma_db
      - ./hf_cache_v2:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
  nginx:
    container_name: nginx
    restart: always
    image: "nginx:latest"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - web_network
    depends_on: 
      - appseed-app
  db:
      image: postgres:14
      container_name: db
      networks:
        - web_network
      environment:
        - POSTGRES_USER=fastapi
        - POSTGRES_PASSWORD=fastapi123
        - POSTGRES_DB=fastapi_db
        - POSTGRES_HOST_AUTH_METHOD=trust
      volumes:
        - ./data/postgres:/var/lib/postgresql/data
      expose:
        - "5432"  
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U fastapi -d fastapi_db"]
        interval: 5s
        timeout: 5s
        retries: 5
networks:
  db_network:
    driver: bridge
  web_network:
    driver: bridge